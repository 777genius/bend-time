name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compatibility:
    name: core compatibility (Bend ${{ matrix.bend.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bend:
          - version: "2.0.28"
            sha: bc178404f4778704fa5584a73fcdf72bcdf9f32c
          - version: "2.0.34"
            sha: 7d8a3eb036042c6549461054d25a10f26d361c5c
          - version: "2.0.36"
            sha: ae1101ca7d15364f9274fa6b1367d175884a7da7
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/checkout@v4
        with:
          repository: bendlang/bend
          ref: ${{ matrix.bend.sha }}
          path: .toolchain/compatibility
      - name: core checks and regression tests
        env:
          BEND_HOME: ${{ github.workspace }}/.toolchain/compatibility
        run: ./tools/check-compatibility

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/checkout@v4
        with:
          repository: bendlang/bend
          ref: 0b7e2b11c1054f5d0f4eb955cadb47997ef1115d
          path: .toolchain/bend
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: e2e
        env:
          BEND_HOME: ${{ github.workspace }}/.toolchain/bend
        run: ./tools/e2e

